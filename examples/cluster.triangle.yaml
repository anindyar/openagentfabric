# yaml-language-server: $schema=../schema/cluster.schema.json
# Example: 3-node point-to-point triangle. NCCL runs over sockets here (NCCL_IB_DISABLE=1).
apiVersion: oaf/v1alpha1
kind: Cluster
metadata:
  name: lab-tri
spec:
  bundle: { version: 0.1.0 }
  nodes:
    - { name: gx-1, address: 10.0.0.21, roles: [control, gateway, observability, inference] }
    - { name: gx-2, address: 10.0.0.22, roles: [inference] }
    - { name: gx-3, address: 10.0.0.23, roles: [inference] }
  fabric:
    topology: triangle
    links:
      - { a: { node: gx-1, interface: enp1s0f0np0 }, b: { node: gx-2, interface: enp1s0f0np0 }, subnet: 10.200.0.0/31 }
      - { a: { node: gx-2, interface: enp1s0f1np1 }, b: { node: gx-3, interface: enp1s0f0np0 }, subnet: 10.200.0.2/31 }
      - { a: { node: gx-3, interface: enp1s0f1np1 }, b: { node: gx-1, interface: enp1s0f1np1 }, subnet: 10.200.0.4/31 }
    nccl: { transport: socket }
  groups:
    - { name: tri, nodes: [gx-1, gx-2, gx-3] }
  models:
    - { name: fast, catalogRef: qwen3-30b-a3b-instruct-2507-fp8, placement: { node: gx-2 }, gpuMemoryUtilization: 0.5 }
  routing:
    defaults: { fast: fast }
