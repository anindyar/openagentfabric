syntax = "proto3";

// The node agent API: oafd drives each node through oaf-node over mTLS.
package oaf.node.v1;

service NodeService {
  // Info identifies the node and agent build.
  rpc Info(InfoRequest) returns (InfoResponse);
  // Preflight runs the read-only node inspection.
  rpc Preflight(PreflightRequest) returns (PreflightResponse);
  // ApplyProject writes a compose project's files and brings it up. It is
  // idempotent: unchanged files report changed=false.
  rpc ApplyProject(ApplyProjectRequest) returns (ApplyProjectResponse);
  // RemoveProject brings a project down and deletes its files.
  rpc RemoveProject(RemoveProjectRequest) returns (RemoveProjectResponse);
  // ProjectStatus reports a project's containers.
  rpc ProjectStatus(ProjectStatusRequest) returns (ProjectStatusResponse);
  // ListProjects names the projects the agent manages.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  // Fabric reports the QSFP ports (read-only discovery).
  rpc Fabric(FabricRequest) returns (FabricResponse);
  // RailBandwidth runs one side of an ib_write_bw test on a local rail. The
  // server side waits for one client; the client retries until the server
  // listens. Both block until the test ends.
  rpc RailBandwidth(RailBandwidthRequest) returns (RailBandwidthResponse);
  // Desktop reports whether the node's local desktop GUI (the display
  // manager) runs, and with set=true switches it: headless stops the desktop
  // and boots without it; graphical brings it back. Never reboots.
  rpc Desktop(DesktopRequest) returns (DesktopResponse);
  // ConfigureFabric makes this node's QSFP rails exactly the given set: it
  // writes OAF's netplan file (/etc/netplan/40-oaf-fabric.yaml), applies it
  // and waits for the addresses. An empty set removes OAF's file. It never
  // touches a netdev that carries an address OAF did not assign.
  rpc ConfigureFabric(ConfigureFabricRequest) returns (ConfigureFabricResponse);
  // ProbeAddress adds or removes a temporary address on a free QSFP netdev
  // (not persisted), for cabling discovery.
  rpc ProbeAddress(ProbeAddressRequest) returns (ProbeAddressResponse);
  // Ping sends pings out of one netdev and reports the link-layer address
  // that answered for the target (the peer port on the cable).
  rpc Ping(PingRequest) returns (PingResponse);
}

message InfoRequest {}

message InfoResponse {
  string hostname = 1;
  string version = 2;
  string arch = 3;
  // Hardware, from read-only reads (cached briefly by the agent).
  string gpu = 4;
  string serial = 5;
  double mem_total_gib = 6;
  double mem_available_gib = 7;
  // Free and total space where OAF keeps models and data.
  double disk_free_gib = 8;
  double disk_total_gib = 9;
}

message PreflightRequest {
  // Where OAF will keep models and data. Empty means the agent default.
  string data_path = 1;
}

message PreflightResponse {
  string host = 1;
  repeated CheckResult results = 2;
  // Worst status: pass, info, warn or fail.
  string worst = 3;
}

message CheckResult {
  string id = 1;
  string status = 2;
  string summary = 3;
  repeated string details = 4;
}

// A project name is a DNS label. The compose project is "oaf-<name>", so the
// agent can never touch containers it did not create.
message ApplyProjectRequest {
  string name = 1;
  // Must include compose.yaml. Paths are relative to the project directory.
  repeated File files = 2;
  // Report what would change without writing files or running compose.
  bool dry_run = 3;
}

message File {
  string path = 1;
  bytes content = 2;
  // Unix permission bits. 0 means 0644.
  uint32 mode = 3;
}

message ApplyProjectResponse {
  bool changed = 1;
  repeated Service services = 2;
  // Paths added, changed (content or mode) or removed, sorted.
  repeated string changed_paths = 3;
}

message RemoveProjectRequest {
  string name = 1;
  bool remove_volumes = 2;
}

message RemoveProjectResponse {
  bool existed = 1;
}

message ProjectStatusRequest {
  string name = 1;
  // Last log lines to return for each container that is not healthy yet
  // (loading progress, the error of a crash loop); 0 returns none.
  int32 log_lines = 2;
}

message ProjectStatusResponse {
  bool exists = 1;
  repeated Service services = 2;
}

message Service {
  string name = 1;
  string state = 2;
  string health = 3;
  string image = 4;
  // When the container last started (RFC 3339) and how often it restarted.
  string started_at = 5;
  int32 restart_count = 6;
  int32 exit_code = 7;
  // The container's last log lines, when asked for and it is not healthy.
  repeated string log_tail = 8;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  // Sorted project names (without the "oaf-" prefix).
  repeated string names = 1;
}

message FabricRequest {}

message FabricResponse {
  repeated FabricPort ports = 1;
}

// One physical QSFP port; its halves are the two rails (one per PCIe domain).
message FabricPort {
  int32 index = 1;
  repeated FabricNetdev halves = 2;
}

message FabricNetdev {
  string name = 1;
  string pci = 2;
  string oper_state = 3;
  int32 mtu = 4;
  int32 speed_mbps = 5;
  // Addresses in CIDR form, excluding link-local.
  repeated string addrs = 6;
  string rdma_dev = 7;
  repeated Gid gids = 8;
  string mac = 9;
}

message Gid {
  int32 index = 1;
  string type = 2;
  string gid = 3;
}

message RailBandwidthRequest {
  // A local RDMA device of a QSFP port, e.g. rocep1s0f1.
  string rdma_dev = 1;
  int32 gid_index = 2;
  // ib_write_bw exchange port, 18515–18614.
  int32 tcp_port = 3;
  int32 duration_seconds = 4;
  int32 queue_pairs = 5;
  // The peer's rail IPv4 address for the client side; empty runs the server.
  string server_addr = 6;
}

message RailBandwidthResponse {
  // Average Gb/s reported by ib_write_bw.
  double gbps = 1;
}

message DesktopRequest {
  // false only reports.
  bool set = 1;
  // With set: true stops the desktop, false starts it.
  bool headless = 2;
  // With set: report what would change, change nothing.
  bool dry_run = 3;
}

message DesktopResponse {
  // "graphical" or "headless" (the default boot target), after any change.
  string mode = 1;
  bool display_manager_active = 2;
  // Resident memory of the display stack (display manager, X/Wayland, the
  // shell); on unified memory this is roughly what headless gives back.
  // An estimate from /proc, not a GPU counter.
  int64 estimated_mib = 3;
  bool changed = 4;
  repeated string warnings = 5;
}

// One rail: a QSFP netdev with its address (CIDR) and MTU (0 means 9000).
message FabricRail {
  string netdev = 1;
  string address = 2;
  int32 mtu = 3;
}

message ConfigureFabricRequest {
  // Every rail this node should have; rails not listed are removed from
  // OAF's netplan file.
  repeated FabricRail rails = 1;
  // Report what would change; change nothing.
  bool dry_run = 2;
}

message RailState {
  string netdev = 1;
  string address = 2;
  // The address is on the netdev (after any change).
  bool present = 3;
  int32 mtu = 4;
  string oper_state = 5;
}

message ConfigureFabricResponse {
  bool changed = 1;
  repeated RailState rails = 2;
  repeated string warnings = 3;
}

message ProbeAddressRequest {
  string netdev = 1;
  // CIDR, inside the probe pool the caller uses.
  string address = 2;
  bool remove = 3;
}

message ProbeAddressResponse {}

message PingRequest {
  // The netdev the pings leave from.
  string netdev = 1;
  string target = 2;
  int32 count = 3;
  // ICMP payload size (0 = the default 56).
  int32 size = 4;
  // Do not fragment (to test the MTU end to end).
  bool dont_fragment = 5;
}

message PingResponse {
  bool ok = 1;
  double rtt_ms = 2;
  // The MAC that answered ARP for the target on this netdev, if any.
  string neighbor_mac = 3;
}
