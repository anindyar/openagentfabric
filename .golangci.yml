version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      # Write errors to the CLI's own output stream are not actionable.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: UK
      # Upstream API names (vLLM --gpu-memory-utilization, gpuMemoryUtilization).
      ignore-rules:
        - utilization
formatters:
  enable:
    - gofmt
    - goimports
